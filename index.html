<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lokacije sadnje drveća – Fondacija 1%</title>
<meta name="description" content="Lokacije, datumi i navigacija za volontersku akciju sadnje drveća u Beogradu.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1a12" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"

      crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  :root {
    --bg: #f6f7f2;
    --surface: #ffffff;
    --text: #111611;
    --muted: #3d473e;
    --border: #b9c2b6;
    --brand: #1f5f2e;
    --brand-text: #ffffff;
    --focus: #0b57d0;
    /* Boje dana – dovoljno kontrastne i u svetlom i u tamnom režimu */
    --petak: #b34700;
    --petak-soft: #fff1e6;
    --subota: #1d4fb8;
    --subota-soft: #e8efff;
    --placeholder-bg: #fff7c2;
    --placeholder-text: #5c4a00;
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1411;
      --surface: #19211b;
      --text: #f1f5ef;
      --muted: #c3cdc1;
      --border: #3b4a3e;
      --brand: #7fd08f;
      --brand-text: #0b140d;
      --focus: #8ab4ff;
      --petak: #ff9a52;
      --petak-soft: #3a2414;
      --subota: #86aaff;
      --subota-soft: #17223d;
      --placeholder-bg: #3d3510;
      --placeholder-text: #ffe680;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 76px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  header.top { padding: 16px 0 4px; }
  /* Logo na beloj podlozi da bude čitljiv i u tamnom režimu */
  .logo-link { display: inline-block; background: #fff; border-radius: 12px; padding: 10px 14px; border: 1px solid var(--border); }
  .logo { display: block; height: 52px; width: auto; }

  .ph { /* vidljiva oznaka za placeholder tekst koji treba popuniti */
    background: var(--placeholder-bg); color: var(--placeholder-text);
    border-radius: 4px; padding: 0 4px; font-style: italic;
  }

  section { margin: 22px 0; }
  h2 { font-size: 1.3rem; margin: 0 0 10px; }

  .days { display: grid; gap: 10px; }
  .day-box {
    background: var(--surface); border: 2px solid var(--border); border-left-width: 10px;
    border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow);
  }
  .day-box.petak { border-left-color: var(--petak); }
  .day-box.subota { border-left-color: var(--subota); }
  .day-box strong { display: block; font-size: 1.15rem; }


  #map {
    height: 58vh; min-height: 320px; max-height: 520px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface);
  }
  .map-fallback { padding: 16px; color: var(--muted); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 1rem; }
  .legend li { display: flex; align-items: center; gap: 8px; }

  /* Pinovi: petak = kvadrat, subota = krug (oblik + boja + broj, ne samo boja) */
  .pin {
    width: 34px; height: 34px; display: grid; place-items: center;
    color: #fff; font: 700 16px/1 system-ui, sans-serif;
    border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5);
  }
  .pin.petak { background: var(--petak); border-radius: 6px; }
  .pin.subota { background: var(--subota); border-radius: 50%; }
  @media (prefers-color-scheme: dark) { .pin { color: #0b140d; border-color: #0b140d; } }
  .legend .pin { width: 26px; height: 26px; font-size: 13px; border-width: 2px; }

  .leaflet-popup-content { font-size: 16px; line-height: 1.4; margin: 12px 14px; }
  .leaflet-popup-content b { font-size: 17px; }
  .popup-day { display: inline-block; margin-top: 4px; font-weight: 700; }

  .filter {
    position: sticky; top: 0; z-index: 1000; background: var(--bg);
    padding: 10px 0; margin: 0 -16px; padding-left: 16px; padding-right: 16px;
    border-bottom: 1px solid var(--border);
  }
  .filter-label { font-weight: 700; margin-bottom: 6px; display: block; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg button {
    min-height: 48px; font: inherit; font-weight: 700; cursor: pointer;
    border: 2px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text);
  }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  .day-group { margin-top: 26px; }
  .day-title {
    margin: 0 0 4px; padding: 10px 14px; border-radius: 10px; font-size: 1.3rem;
    display: flex; align-items: center; gap: 10px;
  }
  .day-title.petak { background: var(--petak-soft); color: var(--text); border: 2px solid var(--petak); }
  .day-title.subota { background: var(--subota-soft); color: var(--text); border: 2px solid var(--subota); }
  .opstina-title { font-size: 1.1rem; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin: 0 0 12px; box-shadow: var(--shadow);
    transition: box-shadow .3s, border-color .3s;
  }
  .card.highlight { border-color: var(--focus); box-shadow: 0 0 0 3px var(--focus); }
  .card-head { display: flex; gap: 12px; align-items: flex-start; }
  .card h4 { margin: 0; font-size: 1.2rem; line-height: 1.3; }
  .meta { margin: 8px 0 0; display: grid; gap: 4px; }
  .meta div { display: flex; gap: 6px; }
  .meta dt { font-weight: 700; flex-shrink: 0; }
  .meta dd { margin: 0; }
  .day-tag { font-weight: 700; }
  .day-tag.petak { color: var(--petak); }
  .day-tag.subota { color: var(--subota); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
    min-height: 52px; padding: 10px 12px; border-radius: 10px; font: inherit; font-weight: 700;
    text-decoration: none; cursor: pointer; border: 2px solid var(--brand);
  }
  .btn-primary { background: var(--brand); color: var(--brand-text); }
  .btn-secondary { background: transparent; color: var(--text); }
  @media (max-width: 360px) { .actions { grid-template-columns: 1fr; } }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(150%);
    background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 10px;
    font-weight: 700; z-index: 2000; transition: transform .25s, visibility .25s; max-width: calc(100% - 32px);
    visibility: hidden;
  }
  .toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }

  footer { color: var(--muted); font-size: .95rem; padding: 24px 0 40px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

<main class="wrap">
  <section aria-labelledby="h-dani">
    <h2 id="h-dani">Kada i gde</h2>
    <div class="days" id="dani"></div>
  </section>

  <section aria-labelledby="h-mapa">
    <h2 id="h-mapa">Mapa lokacija</h2>
    <div id="map" role="region" aria-label="Mapa sa lokacijama sadnje"></div>
    <ul class="legend" id="legenda" aria-label="Legenda mape"></ul>
  </section>

  <section aria-labelledby="h-lok">
    <h2 id="h-lok">Lokacije</h2>
    <div class="filter" role="group" aria-labelledby="filter-label">
      <span class="filter-label" id="filter-label">Prikaži dan:</span>
      <div class="seg">
        <button type="button" data-f="sve" aria-pressed="true">Sve</button>
        <button type="button" data-f="petak" aria-pressed="false">Petak</button>
        <button type="button" data-f="subota" aria-pressed="false">Subota</button>
      </div>
    </div>
    <div id="kartice"></div>
  </section>
</main>

<footer class="wrap">
  Mapa: © saradnici <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>.
  Dugme „Navigiraj“ otvara Google Maps sa uputstvima do lokacije.
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function () {
  "use strict";
  const DANI_RED = ["petak", "subota"];
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Tekst koji počinje sa "[" je placeholder – prikazujemo ga sa žutom oznakom
  const txt = (s) => /^\s*\[/.test(s) ? '<span class="ph">' + esc(s) + "</span>" : esc(s);
  const danPun = (d) => AKCIJA.dani[d].naziv;
  const danSaOpstinama = (d) => AKCIJA.dani[d].naziv + " – " + AKCIJA.dani[d].opstine;

  // --- Dani ---
  $("#dani").innerHTML = DANI_RED.map((d) =>
    '<div class="day-box ' + d + '"><strong>' + esc(AKCIJA.dani[d].naziv) + "</strong>" + esc(AKCIJA.dani[d].opstine) + "</div>"
  ).join("");

  // --- Kartice: po danu, pa po opštini ---
  const navUrl = (l) => "https://www.google.com/maps/dir/?api=1&destination=" + l.lat + "," + l.lng;
  let html = "";
  DANI_RED.forEach((d) => {
    const uDanu = LOKACIJE.filter((l) => l.dan === d);
    if (!uDanu.length) return;
    html += '<div class="day-group" data-dan="' + d + '">';
    html += '<h3 class="day-title ' + d + '"><span class="pin ' + d + '" aria-hidden="true" style="width:22px;height:22px;border-width:2px"></span>' + esc(danSaOpstinama(d)) + "</h3>";
    const opstine = [...new Set(uDanu.map((l) => l.opstina))];
    opstine.forEach((o) => {
      html += '<p class="opstina-title">' + esc(o) + "</p>";
      uDanu.filter((l) => l.opstina === o).forEach((l) => {
        html +=
          '<article class="card" id="lok-' + l.id + '" tabindex="-1" aria-labelledby="lok-n-' + l.id + '">' +
            '<div class="card-head"><span class="pin ' + d + '" aria-hidden="true">' + l.id + "</span>" +
            '<h4 id="lok-n-' + l.id + '"><span class="sr">' + l.id + ". </span>" + txt(l.naziv) + "</h4></div>" +
            '<dl class="meta">' +
              '<div><dt>Dan:</dt><dd class="day-tag ' + d + '">' + esc(danPun(d)) + "</dd></div>" +
              "<div><dt>Vreme:</dt><dd>" + txt(l.vreme) + "</dd></div>" +
              "<div><dt>Adresa:</dt><dd>" + txt(l.adresa) + "</dd></div>" +
              "<div><dt>Opština:</dt><dd>" + esc(l.opstina) + "</dd></div>" +
              "<div><dt>Napomena:</dt><dd>" + txt(l.napomena) + "</dd></div>" +
            "</dl>" +
            '<div class="actions">' +
              '<a class="btn btn-primary" href="' + navUrl(l) + '" target="_blank" rel="noopener">➜ Navigiraj</a>' +
              '<button type="button" class="btn btn-secondary" data-copy="' + l.id + '">Kopiraj adresu</button>' +
            "</div>" +
          "</article>";
      });
    });
    html += "</div>";
  });
  $("#kartice").innerHTML = html;
  // broj ispred naziva služi samo čitačima ekrana (broj je već u pinu)
  const st = document.createElement("style");
  st.textContent = ".sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}";
  document.head.appendChild(st);

  // --- Kopiranje adrese ---
  const toast = $("#toast");
  let toastT;
  function showToast(m) { toast.textContent = m; toast.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove("show"), 2200); }
  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
    return new Promise((res, rej) => { // rezerva za starije/ugrađene browsere (Viber, WhatsApp)
      const ta = document.createElement("textarea");
      ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy") ? res() : rej(); } catch (e) { rej(e); }
      document.body.removeChild(ta);
    });
  }
  $("#kartice").addEventListener("click", (e) => {
    const b = e.target.closest("[data-copy]");
    if (!b) return;
    const l = LOKACIJE.find((x) => String(x.id) === b.dataset.copy);
    const t = l.naziv + ", " + l.adresa + ", " + l.opstina + ", Beograd\n" + l.lat + ", " + l.lng;
    copyText(t).then(() => showToast("Adresa je kopirana ✓"), () => { window.prompt("Kopirajte adresu:", t); });
  });

  // --- Mapa ---
  const markeri = {};
  let map = null;
  const legenda = DANI_RED.map((d) =>
    '<li><span class="pin ' + d + '" aria-hidden="true">' + (d === "petak" ? "P" : "S") + "</span>" +
    esc(AKCIJA.dani[d].naziv) + " (" + (d === "petak" ? "kvadrat" : "krug") + ")</li>").join("");
  $("#legenda").innerHTML = legenda;

  function scrollToCard(id) {
    const c = document.getElementById("lok-" + id);
    if (!c) return;
    // pomeri tako da kartica ne bude ispod lepljivog filtera
    const filterH = document.querySelector(".filter").offsetHeight;
    window.scrollTo({ top: c.getBoundingClientRect().top + window.scrollY - filterH - 12, behavior: "smooth" });
    c.classList.add("highlight");
    setTimeout(() => c.classList.remove("highlight"), 2500);
    c.focus({ preventScroll: true });
  }

  if (window.L) {
    map = L.map("map", { scrollWheelZoom: false, tap: true });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    LOKACIJE.forEach((l) => {
      const icon = L.divIcon({ className: "", html: '<div class="pin ' + l.dan + '">' + l.id + "</div>", iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -16] });
      const m = L.marker([l.lat, l.lng], { icon, title: l.id + ". " + l.naziv + " – " + danPun(l.dan), keyboard: true })
        .bindPopup("<b>" + l.id + ". " + esc(l.naziv) + '</b><br><span class="popup-day">' + esc(danPun(l.dan)) + "</span><br>" + esc(l.vreme));
      m.on("click", () => setTimeout(() => scrollToCard(l.id), 600));
      m.addTo(map);
      markeri[l.id] = m;
    });
  } else {
    $("#map").innerHTML = '<p class="map-fallback">Mapa trenutno ne može da se učita. Sve lokacije i dugmad za navigaciju su ispod.</p>';
  }

  function fit(lista) {
    if (!map || !lista.length) return;
    map.fitBounds(L.latLngBounds(lista.map((l) => [l.lat, l.lng])), { padding: [30, 30], maxZoom: 16 });
  }

  // --- Filter Sve / Petak / Subota ---
  function primeni(f) {
    document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === f)));
    document.querySelectorAll(".day-group").forEach((g) => { g.hidden = !(f === "sve" || g.dataset.dan === f); });
    const vidljive = LOKACIJE.filter((l) => f === "sve" || l.dan === f);
    if (map) {
      map.closePopup();
      LOKACIJE.forEach((l) => {
        const m = markeri[l.id];
        const treba = vidljive.includes(l);
        if (treba && !map.hasLayer(m)) m.addTo(map);
        if (!treba && map.hasLayer(m)) map.removeLayer(m);
      });
      fit(vidljive);
    }
  }
  document.querySelector(".seg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-f]");
    if (b) primeni(b.dataset.f);
  });
  primeni("sve");
})();
</script>
